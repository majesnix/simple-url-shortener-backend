services:
  db:
    image: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      # SECURITY: override with a strong value in production (e.g. via .env or Docker secrets).
      # The default is used for local development only.
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  backend:
    # The tag is provided by sbt (deployContainers/runItTest) from Docker/version
    # in build.sbt; the default only serves plain `docker compose up`.
    image: codingbros/sus-backend:${SUS_VERSION:-2.1.3}
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      # Set to the public hostname of this deployment so the guard against
      # shortening the shortener's own links works, e.g.:
      # - SERVER_URL=sus.example.com
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

server {
  host = "0.0.0.0"
  host = ${?SERVER_HOST}
  port = 8080
  port = ${?SERVER_PORT}
  url = "localhost"
  url = ${?SERVER_URL}
  # Comma-separated origins allowed to call the API from a browser,
  # e.g. "https://dcl.re". Empty allows every origin.
  cors-origins = ""
  cors-origins = ${?CORS_ORIGINS}
  # Request bodies reaching this size are rejected with 413.
  max-body-bytes = 16384
  max-body-bytes = ${?MAX_BODY_BYTES}
}

rate-limit {
  # Link creations (POST) allowed per client and window; 0 disables the limit.
  max-requests = 30
  max-requests = ${?RATE_LIMIT_MAX_REQUESTS}
  window = 1 minute
  window = ${?RATE_LIMIT_WINDOW}
  # Number of trusted reverse proxies in front of the service. 0 identifies
  # clients by TCP peer address; behind one proxy (nginx, Traefik, ...) set 1
  # so the client address is taken from X-Forwarded-For.
  forwarded-for-hops = 0
  forwarded-for-hops = ${?RATE_LIMIT_FORWARDED_FOR_HOPS}
}

database {
  host = "localhost"
  host = ${?DB_HOST}
  port = 5432
  port = ${?DB_PORT}
  database = "postgres"
  database = ${?DB_DATABASE}
  user = "postgres"
  user = ${?DB_USER}
  password = "postgres"
  password = ${?DB_PASSWORD}
  thread-pool-size = 32
  thread-pool-size = ${?DB_POOL_SIZE}
}